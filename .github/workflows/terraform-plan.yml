name: Terraform Plan

on:
   # Trigger the workflow on pushes to 'main' and any feature branches
  pull_request:
    branches:
      - dev

jobs:
  terraform:
    name: Run Terraform Plan
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Set up Terraform
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 'latest' # Specify the Terraform version you want

      # Configure AWS credentials (for example, if using AWS)
      # If you use other cloud providers like Azure or GCP, update this section accordingly.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_region: us-east-1

      # Initialize Terraform (download providers, etc.)
      - name: Terraform Init
        run: terraform init

      # Run Terraform Plan
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # Upload the plan as an artifact (optional)
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v2
        with:
          name: terraform-plan
          path: tfplan

