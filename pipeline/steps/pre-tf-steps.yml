steps:
- script: |
    echo "Use Pipeline Artifact and deploy to env"
    # Export AWS credentials from pipeline variables
    export AWS_ACCESS_KEY_ID=$(aws-access-key-id)
    export AWS_SECRET_ACCESS_KEY=$(aws-secret-access-key-id)
    # Set the AWS region
    export AWS_DEFAULT_REGION="us-west-2"
    OUTPUT_PROFILE="AWSCLI-AssumeRole"

    # Assume the role and capture the credentials
    echo "Assuming role..."
    ASSUME_ROLE_OUTPUT=$(aws sts assume-role --role-arn "arn:aws:iam::$(awsAccount):role/fondo/sdge-dcctr-$(Environment)-terraform-oidc-role" --role-session-name "$OUTPUT_PROFILE" --output json)

    # Check if the assume-role command was successful
    if [ $? -eq 0 ]; then
        # Extract credentials
        ACCESS_KEY=$(echo $ASSUME_ROLE_OUTPUT | jq -r '.Credentials.AccessKeyId')
        SECRET_KEY=$(echo $ASSUME_ROLE_OUTPUT | jq -r '.Credentials.SecretAccessKey')
        SESSION_TOKEN=$(echo $ASSUME_ROLE_OUTPUT | jq -r '.Credentials.SessionToken')
        # Export the new session credentials for subsequent AWS CLI commands
        export AWS_ACCESS_KEY_ID=$ACCESS_KEY
        export AWS_SECRET_ACCESS_KEY=$SECRET_KEY
        export AWS_SESSION_TOKEN=$SESSION_TOKEN
        ASSUMED_ROLE_ARN=$(echo $ASSUME_ROLE_OUTPUT | jq -r '.AssumedRoleUser.Arn')
        echo "Assumed role ARN: $ASSUMED_ROLE_ARN"
        echo "Creating the quicksight file!"
        ls
        echo $(Pipeline.Workspace)

        # jobId="sdge-export-job-IVR"
        jobId='saipraneeth-import-qs-bundle'
        

        # Asset bundle import job for IVR
        # aws quicksight start-asset-bundle-import-job --aws-account-id "$(awsAccount)" --asset-bundle-import-job-id 'sdge-export-job-IVR' --asset-bundle-import-source-bytes fileb://$(Pipeline.Workspace)/QS_Bundle_IVR/assetbundle-sdge-export-job-IVR.qs --override-parameters "{\"DataSources\":[{\"DataSourceId\":\"867d6f11-6f0a-4f40-b865-6a0cc5baf78f\",\"Name\":\"$(qstargetenv)_connectdatalake\",\"DataSourceParameters\":{\"AthenaParameters\":{\"WorkGroup\":\"primary\"}},\"SslProperties\":{\"DisableSsl\":false}}],\"DataSets\":[{\"DataSetId\":\"2637d8cd-26a2-4075-943d-9ed0a7e94946\",\"Name\":\"ivr_combined_2509data_ext_table\"}]}" --failure-action ROLLBACK

        # Asset bundle import job for Testing 

        aws quicksight start-asset-bundle-import-job --aws-account-id "$(awsAccount)" --asset-bundle-import-job-id 'saipraneeth-import-qs-bundle' --asset-bundle-import-source-bytes fileb://$(Pipeline.Workspace)/QS_Bundle_IVR/assetbundle-sdge-export-job-IVR.qs --override-parameters "{\"DataSources\":[{\"DataSourceId\":\"86e7235f-b068-49af-aec2-795b4db569ad\",\"Name\":\"saipraneeth_devop_qs_testing\",\"DataSourceParameters\":{\"AthenaParameters\":{\"WorkGroup\":\"primary\"}},\"SslProperties\":{\"DisableSsl\":false}}],\"DataSets\":[{\"DataSetId\":\"7077ae2d-683e-4651-99f2-38e8efc2a42a\",\"Name\":\"ivr_data_saipraneeth_devop_qs\"}]}" --failure-action ROLLBACK



        echo "started the asset bundle import job"

        while true; do
            # Get the job details
            response=$(aws quicksight describe-asset-bundle-import-job --aws-account-id "$(awsAccount)" --asset-bundle-import-job-id $jobId)

            # Check if the command was successful
            if [ $? -eq 0 ]; then
                jobStatus=$(echo $response | grep -o '"JobStatus": "[^"]*' | grep -o '[^"]*$')
                if [ "$jobStatus" == "SUCCESSFUL" ]; then
                    echo "Quicksight Package deployed"
                    echo "Updating the dataset!"
                    # Updating the dataset after dashboard is deployed

                    # aws quicksight update-data-set --aws-account-id "$(awsAccount)" --data-set-id "2637d8cd-26a2-4075-943d-9ed0a7e94946" --name "ivr_combined_2509data_ext_table" --physical-table-map "{\"c2576ff2-6a9a-4315-832b-4038396a5248\":{\"RelationalTable\":{\"DataSourceArn\":\"arn:aws:quicksight:us-west-2:"$(awsAccount)":datasource/867d6f11-6f0a-4f40-b865-6a0cc5baf78f\",\"Catalog\":\"AwsDataCatalog\",\"Schema\":\"$(qstargetenv)_connectdatalake\",\"Name\":\"ivr_combined_2509data_ext_table\",\"InputColumns\":[{\"Name\":\"contact_id\",\"Type\":\"STRING\"},{\"Name\":\"channel\",\"Type\":\"STRING\"},{\"Name\":\"initiation_method\",\"Type\":\"STRING\"},{\"Name\":\"is_queued\",\"Type\":\"INTEGER\"},{\"Name\":\"attributes\",\"Type\":\"STRING\"},{\"Name\":\"call_start_date_time\",\"Type\":\"STRING\"},{\"Name\":\"call_end_reason\",\"Type\":\"STRING\"},{\"Name\":\"caller_phone_number\",\"Type\":\"STRING\"},{\"Name\":\"day_of_week\",\"Type\":\"STRING\"},{\"Name\":\"weekday_check\",\"Type\":\"STRING\"},{\"Name\":\"date\",\"Type\":\"DATETIME\"},{\"Name\":\"curtailmentflag\",\"Type\":\"STRING\"},{\"Name\":\"l3_tag\",\"Type\":\"STRING\"},{\"Name\":\"l1_tag\",\"Type\":\"STRING\"},{\"Name\":\"l2_tag\",\"Type\":\"STRING\"},{\"Name\":\"l3_tag\",\"Type\":\"STRING\"}]}}}" --import-mode SPICE --logical-table-map "{\"5cb33d9a-78b1-4cc3-91e2-e40ee2fa12a7\":{\"Alias\":\"ivr_combined_2509data_ext_table\",\"DataTransforms\":[{\"ProjectOperation\":{\"ProjectedColumns\":[\"contact_id\",\"channel\",\"initiation_method\",\"is_queued\",\"attributes\",\"call_start_date_time\",\"call_end_reason\",\"caller_phone_number\",\"day_of_week\",\"weekday_check\",\"date\",\"curtailmentflag\",\"l3_tag\",\"l1_tag\",\"l2_tag\"]}}],\"Source\":{\"PhysicalTableId\":\"c2576ff2-6a9a-4315-832b-4038396a5248\"}}}" --field-folders '{}'
                    # aws quicksight update-data-set --aws-account-id "$(awsAccount)" --data-set-id "2637d8cd-26a2-4075-943d-9ed0a7e94946" --name "ivr_combined_2509data_ext_table" --physical-table-map "{\"c2576ff2-6a9a-4315-832b-4038396a5248\":{\"RelationalTable\":{\"DataSourceArn\":\"arn:aws:quicksight:us-west-2:"$(awsAccount)":datasource/867d6f11-6f0a-4f40-b865-6a0cc5baf78f\",\"Catalog\":\"AwsDataCatalog\",\"Schema\":\"$(qstargetenv)_connectdatalake\",\"Name\":\"ivr_combined_2509data_ext_table\",\"InputColumns\":[{\"Name\": \"contact_id\",   \"Type\": \"STRING\" }, {   \"Name\": \"is_queued\",   \"Type\": \"INTEGER\" }, {   \"Name\": \"call_start_date_time\",   \"Type\": \"STRING\" }, {   \"Name\": \"call_start_date_time_hours\",   \"Type\": \"STRING\" }, {   \"Name\": \"self_service_block\",   \"Type\": \"STRING\" }, {   \"Name\": \"module_where_call_ended\",   \"Type\": \"STRING\" }, {   \"Name\": \"self_service_count\",   \"Type\": \"STRING\" }, {   \"Name\": \"call_duration_minute\",   \"SubType\": \"FLOAT\",   \"Type\": \"DECIMAL\" }, {   \"Name\": \"call_end_destination\",   \"Type\": \"STRING\" }, {   \"Name\": \"customer_type\",   \"Type\": \"STRING\" }, {   \"Name\": \"contract_account\",   \"Type\": \"STRING\" }, {   \"Name\": \"supplied_phone_number\",   \"Type\": \"STRING\" }, {   \"Name\": \"call_end_reason\",   \"Type\": \"STRING\" }, {   \"Name\": \"caller_phone_number\",   \"Type\": \"STRING\" }, {   \"Name\": \"day_of_week\",   \"Type\": \"STRING\" }, {   \"Name\": \"customer_journey\",   \"Type\": \"STRING\" }, {   \"Name\": \"module_journey\",   \"Type\": \"STRING\" }, {   \"Name\": \"intent_journey\",   \"Type\": \"STRING\" }, {   \"Name\": \"weekday_check\",   \"Type\": \"STRING\" }, {   \"Name\": \"date\",   \"Type\": \"DATETIME\" }, {   \"Name\": \"l3_tag\",   \"Type\": \"STRING\" }, {   \"Name\": \"attributes\",   \"Type\": \"STRING\" }, {   \"Name\": \"l1_tag\",   \"Type\": \"STRING\" }, {   \"Name\": \"l2_tag\",   \"Type\": \"STRING\" }]}}}" --import-mode SPICE --logical-table-map "{\"5cb33d9a-78b1-4cc3-91e2-e40ee2fa12a7\":{\"Alias\":\"ivr_combined_2509data_ext_table\",\"DataTransforms\":[{\"ProjectOperation\":{\"ProjectedColumns\":[\"contact_id\",\"channel\",\"initiation_method\",\"is_queued\",\"attributes\",\"call_start_date_time\",\"call_end_reason\",\"caller_phone_number\",\"day_of_week\",\"weekday_check\",\"date\",\"curtailmentflag\",\"l3_tag\",\"l1_tag\",\"l2_tag\"]}}],\"Source\":{\"PhysicalTableId\":\"c2576ff2-6a9a-4315-832b-4038396a5248\"}}}" --field-folders '{}'
                    
                    
                    # adding test dashboard dataset

                    aws quicksight update-data-set --aws-account-id "$(awsAccount)" --data-set-id "7077ae2d-683e-4651-99f2-38e8efc2a42a" --name "ivr_data_saipraneeth_devop_qs" --physical-table-map "{\"db66ac78-931e-4ae3-800d-602d5ed2ad8e\":{\"RelationalTable\":{\"DataSourceArn\":\"arn:aws:quicksight:us-west-2:"$(awsAccount)":datasource/86e7235f-b068-49af-aec2-795b4db569ad\",\"Catalog\":\"AwsDataCatalog\",\"Schema\":\"sdge-dcctr-$(qstargetenv)-wus2-gdc-ccc-analytics-connect-datalake-views\",\"Name\":\"ivr_combined_2509data_ext_table\", \"InputColumns\":[{\"Name\": \"contact_id\",   \"Type\": \"STRING\" }, {   \"Name\": \"is_queued\",   \"Type\": \"INTEGER\" }, {   \"Name\": \"call_start_date_time\",   \"Type\": \"STRING\" }, {   \"Name\": \"call_start_date_time_hours\",   \"Type\": \"STRING\" }, {   \"Name\": \"self_service_block\",   \"Type\": \"STRING\" }, {   \"Name\": \"module_where_call_ended\",   \"Type\": \"STRING\" }, {   \"Name\": \"self_service_count\",   \"Type\": \"STRING\" }, {   \"Name\": \"call_duration_minute\",   \"SubType\": \"FLOAT\",   \"Type\": \"DECIMAL\" }, {   \"Name\": \"call_end_destination\",   \"Type\": \"STRING\" }, {   \"Name\": \"customer_type\",   \"Type\": \"STRING\" }, {   \"Name\": \"contract_account\",   \"Type\": \"STRING\" }, {   \"Name\": \"supplied_phone_number\",   \"Type\": \"STRING\" }, {   \"Name\": \"call_end_reason\",   \"Type\": \"STRING\" }, {   \"Name\": \"caller_phone_number\",   \"Type\": \"STRING\" }, {   \"Name\": \"day_of_week\",   \"Type\": \"STRING\" }, {   \"Name\": \"customer_journey\",   \"Type\": \"STRING\" }, {   \"Name\": \"module_journey\",   \"Type\": \"STRING\" }, {   \"Name\": \"intent_journey\",   \"Type\": \"STRING\" }, {   \"Name\": \"weekday_check\",   \"Type\": \"STRING\" }, {   \"Name\": \"date\",   \"Type\": \"DATETIME\" }, {   \"Name\": \"l3_tag\",   \"Type\": \"STRING\" }, {   \"Name\": \"attributes\",   \"Type\": \"STRING\" }, {   \"Name\": \"l1_tag\",   \"Type\": \"STRING\" }, {   \"Name\": \"l2_tag\",   \"Type\": \"STRING\" }]}}}" --import-mode SPICE --logical-table-map "{\"e2f8ab68-f920-4a6e-a65d-324311fcf39f\":{\"Alias\":\"ivr_combined_2509data_ext_table\",\"DataTransforms\":[{\"ProjectOperation\":{\"ProjectedColumns\":[\"contact_id\", \"is_queued\", \"call_start_date_time\", \"call_start_date_time_hours\", \"self_service_block\", \"module_where_call_ended\", \"self_service_count\", \"call_duration_minute\", \"call_end_destination\", \"customer_type\", \"contract_account\", \"supplied_phone_number\", \"call_end_reason\", \"caller_phone_number\", \"day_of_week\", \"customer_journey\", \"module_journey\", \"intent_journey\", \"weekday_check\", \"date\", \"l3_tag\", \"attributes\", \"l1_tag\", \"l2_tag\"]}}],\"Source\":{\"PhysicalTableId\":\"db66ac78-931e-4ae3-800d-602d5ed2ad8e\"}}}"

                    break
                else
                    echo "Job status is not successful: $jobStatus"
                    sleep 10
                fi
            else
                echo "Failed to get the job details"
                exit 1
            fi
        done

    #   aws quicksight start-asset-bundle-import-job --aws-account-id "$(awsAccount)" --asset-bundle-import-job-id 'sdge-export-job-WBDB' --asset-bundle-import-source-bytes fileb://$(Pipeline.Workspace)/QS_Bundle_WBDB/assetbundle-sdge-export-job-WBDB.qs  --failure-action ROLLBACK

    #   jobId="sdge-export-job-WBDB"
      
    #   while true; do
    #     # Get the job details
    #     response=$(aws quicksight describe-asset-bundle-import-job --aws-account-id "$(awsAccount)" --asset-bundle-import-job-id $jobId)

    #     # Check if the command was successful
    #     if [ $? -eq 0 ]; then
    #         jobStatus=$(echo $response | grep -o '"JobStatus": "[^"]*' | grep -o '[^"]*$')
    #         if [ "$jobStatus" == "SUCCESSFUL" ]; then
    #             echo "Quicksight Package deployed"
    #             aws quicksight update-data-set --aws-account-id "$(awsAccount)" --data-set-id "168c6220-5dbd-4a73-a6fb-caa0553084f0" --name "connectapi" --physical-table-map "{\"38939462-7280-4626-8dc7-c1bbe70d09cd\":{\"RelationalTable\":{\"DataSourceArn\":\"arn:aws:quicksight:us-west-2:442426866507:datasource/d6d5c21d-d1be-4895-9256-3fbf8222a4c7\",\"Catalog\":\"AwsDataCatalog\",\"Schema\":\"$(qstargetenv)_connectdatalake\",\"Name\":\"connectapi\",\"InputColumns\":[{\"Name\":\"queue_id\",\"Type\":\"STRING\"},{\"Name\":\"metrics\",\"Type\":\"STRING\"},{\"Name\":\"metric_value\",\"Type\":\"DECIMAL\"},{\"Name\":\"language\",\"Type\":\"STRING\"},{\"Name\":\"type\",\"Type\":\"STRING\"},{\"Name\":\"ess2\",\"Type\":\"STRING\"}]}}}" --import-mode DIRECT_QUERY --logical-table-map "{\"25b1f640-9223-4d94-9927-fd52122f730c\":{\"Alias\":\"connectapi\",\"DataTransforms\":[{\"ProjectOperation\":{\"ProjectedColumns\":[\"queue_id\",\"metrics\",\"metric_value\",\"language\",\"type\",\"ess2\"]}}],\"Source\":{\"PhysicalTableId\":\"38939462-7280-4626-8dc7-c1bbe70d09cd\"}}}"
    #             break
    #         else
    #             echo "Job status is not successful: $jobStatus"
    #             sleep 10
