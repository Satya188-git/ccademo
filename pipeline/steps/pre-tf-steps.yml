steps:
- script: |
    echo "Use Pipeline Artifact and deploy to env"

    if [ "$(Environment)" == "dev" ]; then
      echo "DEV deployment is not required"
      exit 0
    fi

    ##################################################
    # Export AWS credentials from pipeline variables #
    ##################################################

    export AWS_ACCESS_KEY_ID=$(aws-access-key-id)
    export AWS_SECRET_ACCESS_KEY=$(aws-secret-access-key-id)

    ##################################################
    ############## Set the AWS region ################
    ##################################################

    export AWS_DEFAULT_REGION="us-west-2"
    OUTPUT_PROFILE="AWSCLI-AssumeRole"

    ###################################################
    ### Assume the role and capture the credentials ###
    ###################################################

    echo "Assuming the ADO role..."
    ASSUME_ROLE_OUTPUT=$(aws sts assume-role --role-arn "arn:aws:iam::$(awsAccount):role/fondo/sdge-dcctr-$(Environment)-iam-role-ado" --role-session-name "$OUTPUT_PROFILE" --output json)
    
    #####################################################
    ## Check if the assume-role command was successful ##
    #####################################################

    if [ $? -eq 0 ]; then

        #########################
        ## Extract credentials ##
        #########################

        ACCESS_KEY=$(echo $ASSUME_ROLE_OUTPUT | jq -r '.Credentials.AccessKeyId')
        SECRET_KEY=$(echo $ASSUME_ROLE_OUTPUT | jq -r '.Credentials.SecretAccessKey')
        SESSION_TOKEN=$(echo $ASSUME_ROLE_OUTPUT | jq -r '.Credentials.SessionToken')

        ########################################################################
        ## Export the new session credentials for subsequent AWS CLI commands ##
        ########################################################################

        export AWS_ACCESS_KEY_ID=$ACCESS_KEY
        export AWS_SECRET_ACCESS_KEY=$SECRET_KEY
        export AWS_SESSION_TOKEN=$SESSION_TOKEN
        ASSUMED_ROLE_ARN=$(echo $ASSUME_ROLE_OUTPUT | jq -r '.AssumedRoleUser.Arn')
        echo "Assumed role ARN: $ASSUMED_ROLE_ARN"
        echo "Creating the quicksight file!"

        echo "listing the directory content:"
        ls
        echo "*****************************"
        echo "Workspace details: "
        echo $(Pipeline.Workspace)

        jobId="sdge-export-job-IVR"
        
        #####################################
        ## Asset bundle import job for IVR ##
        #####################################

        aws quicksight start-asset-bundle-import-job --aws-account-id "$(awsAccount)" --asset-bundle-import-job-id 'sdge-export-job-IVR' --asset-bundle-import-source-bytes fileb://$(Pipeline.Workspace)/QS_Bundle_IVR/assetbundle-sdge-export-job-IVR.qs --override-parameters "{\"DataSources\":[{\"DataSourceId\":\"867d6f11-6f0a-4f40-b865-6a0cc5baf78f\",\"Name\":\"$(qstargetenv)_connectdatalake\",\"DataSourceParameters\":{\"AthenaParameters\":{\"WorkGroup\":\"primary\"}},\"SslProperties\":{\"DisableSsl\":false}}],\"DataSets\":[{\"DataSetId\":\"2637d8cd-26a2-4075-943d-9ed0a7e94946\",\"Name\":\"ivr_combined_2509data_ext_table\"}]}" --failure-action ROLLBACK

        echo "Started the asset bundle import job for IVR"

        while true; do

            #########################
            ## Get the job details ##
            #########################

            response=$(aws quicksight describe-asset-bundle-import-job --aws-account-id "$(awsAccount)" --asset-bundle-import-job-id $jobId)
            
            #########################################
            ## Check if the command was successful ##
            #########################################

            if [ $? -eq 0 ]; then

                jobStatus=$(echo $response | grep -o '"JobStatus": "[^"]*' | grep -o '[^"]*$')

                if [ "$jobStatus" == "SUCCESSFUL" ]; then

                    echo "IVR Quicksight Package deployed"
                    echo "Updating the IVR Dataset!"

                    ######################################################
                    ## Updating the dataset after dashboard is deployed ##
                    ######################################################

