                    aws quicksight update-data-set --aws-account-id "$(awsAccount)" --data-set-id "ce88acbd-2b70-42a4-af08-4d5ebd0b6181" --name "ivr_call_transactions" --import-mode SPICE --physical-table-map "{\"3a4e1cf3-3f68-4a46-8c7e-b8d934240134\":{\"RelationalTable\":{\"DataSourceArn\":\"arn:aws:quicksight:us-west-2:"$(awsAccount)":datasource/fd19c252-1725-4e1e-8bff-68a9bbc46cfe\",\"Catalog\":\"AwsDataCatalog\",\"Schema\":\"sdge-dcctr-$(qstargetenv)-wus2-ccc-analytics-connect-datalake-views\",\"Name\":\"ivr_call_transactions\",\"InputColumns\":[{\"Name\":\"contact_id\",\"Type\":\"STRING\"},{\"Name\":\"is_queued\",\"Type\":\"INTEGER\"},{\"Name\":\"call_start_date_time\",\"Type\":\"DATETIME\"},{\"Name\":\"call_start_date_time_hours\",\"Type\":\"DATETIME\"},{\"Name\":\"self_service_block\",\"Type\":\"STRING\"},{\"Name\":\"module_where_call_ended\",\"Type\":\"STRING\"},{\"Name\":\"self_service_count\",\"Type\":\"STRING\"},{\"Name\":\"call_duration_minute\",\"SubType\":\"FLOAT\",\"Type\":\"DECIMAL\"},{\"Name\":\"call_end_destination\",\"Type\":\"STRING\"},{\"Name\":\"customer_type\",\"Type\":\"STRING\"},{\"Name\":\"contract_account\",\"Type\":\"STRING\"},{\"Name\":\"supplied_phone_number\",\"Type\":\"STRING\"},{\"Name\":\"call_end_reason\",\"Type\":\"STRING\"},{\"Name\":\"caller_phone_number\",\"Type\":\"STRING\"},{\"Name\":\"day_of_week\",\"Type\":\"STRING\"},{\"Name\":\"customer_journey\",\"Type\":\"STRING\"},{\"Name\":\"module_journey\",\"Type\":\"STRING\"},{\"Name\":\"intent_journey\",\"Type\":\"STRING\"},{\"Name\":\"weekday_check\",\"Type\":\"STRING\"},{\"Name\":\"date\",\"Type\":\"DATETIME\"},{\"Name\":\"l3_tag\",\"Type\":\"STRING\"},{\"Name\":\"attributes\",\"Type\":\"STRING\"},{\"Name\":\"l1_tag\",\"Type\":\"STRING\"},{\"Name\":\"l2_tag\",\"Type\":\"STRING\"},{\"Name\":\"event_sequence\",\"Type\":\"INTEGER\"},{\"Name\":\"module_journey_part\",\"Type\":\"STRING\"},{\"Name\":\"module_name\",\"Type\":\"STRING\"},{\"Name\":\"transaction_reason\",\"Type\":\"STRIN