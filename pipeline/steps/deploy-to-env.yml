
# Deployment stage runs after Terraform Stages.
steps:
  - script: |
      echo "Deployment Step after terrafrom!"
  
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.11.1'
      addToPath: true
      architecture: 'x64'

# create virtual environment, install pre reqs,package
  - script: |
      echo "Creating new virtualenv"
      python3 -m venv --clear .env
      source .env/bin/activate 
      python3 -m pip install artifacts-keyring; python3 -m pip install boto3
    displayName: 'Install Boto3'

  # - script: |
  #     echo "Configuring the aws cli"
  #     aws configure set aws_access_key_id $(aws-access-key-id)
  #     aws configure set aws_secret_access_key $(aws-secret-access-key-id)
  #     aws configure set region us-west-2
  #     aws configure set output json
  #     echo "Configured the aws cli"
  #     aws s3 ls
  #   displayName: 'aws cli config'

  - task: AWSCLI@1
    displayName: "Start listing s3 buckets"
    inputs:
      awsCredentials: "sdge-cs-cccanalytics-dev"
      regionName: "us-west-2"
      awsCommand: "s3"
      awsSubCommand: "ls"

  - task: AWSShellScript@1
    continueOnError: False
    inputs:
      awsCredentials: ${{ parameters.awsCredentials }}
      regionName: 'us-west-2'
      scriptType: 'inline'
      failOnStderr: True
      inlineScript: |
        ls
        echo "Beginning the bake process"
    displayName: "Bake stage"
    name: bakeImageTest

# - task: PythonScript@0
#   inputs:
#     scriptSource: 'filePath'
#     scriptPath: 'src/python/main.py'

# Deactivate Virtual Environment and Clean-up
  - script: |
      echo "Cleaning up Virtual Environment"
      if [ -d ".env" ]; then echo "removing virtual environment" ; rm -rf .env ; else echo ".env directory doesn't exist" ; fi
      pip freeze
    displayName: 'Destroy VirtualEnv'
    workingDirectory: $(System.DefaultWorkingDirectory)