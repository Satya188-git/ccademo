      # echo "AWS account credentials stored in the profile named $OUTPUT_PROFILE"
      # echo "Testing s3 ls"
      # aws s3 
      # Assuming you have functions to get access keys
      export AWS_ACCESS_KEY_ID=$(aws-access-key-id)
      export AWS_SECRET_ACCESS_KEY=$(aws-secret-access-key-id)
      OUTPUT_PROFILE="AWSCLI-AssumeRole"

      # Assume the role
      echo "Assuming role $(awsAssumeRole)"
      # sts=$(aws sts assume-role --role-arn "$(awsAssumeRole)" --role-session-name "$OUTPUT_PROFILE" --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text)
      sts=$(aws sts assume-role --role-arn "arn:aws:iam::442426866507:role/sdge-dcctr-dev-wus2-glue-sample-role" --role-session-name "$OUTPUT_PROFILE" --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text)

      # Check if the assume-role command was successful
      if [ $? -ne 0 ]; then
          echo "Failed to assume role."
          exit 1
      fi

      echo "Converting sts to array"
      stsarray=($sts)

      # Check if the sts array has exactly 3 elements
      if [ ${#stsarray[@]} -ne 3 ]; then
          echo "Failed to retrieve valid STS credentials."
          exit 1
      fi

      aws configure set aws_access_key_id "${stsarray[0]}" --profile "$OUTPUT_PROFILE"
      aws configure set aws_secret_access_key "${stsarray[1]}" --profile "$OUTPUT_PROFILE"
      aws configure set aws_session_token "${stsarray[2]}" --profile "$OUTPUT_PROFILE"

      echo "AWS account credentials stored in the profile named $OUTPUT_PROFILE"

      # Test if the credentials work by listing S3 buckets
      # echo "Testing s3 ls"
      # if ! aws s3 ls --profile "$OUTPUT_PROFILE"; then
      #     echo "Failed to list S3 buckets. The role may not have been assumed successfully."
      #     exit 1
      # fi

      # echo "S3 buckets listed successfully."
      echo "Running Python file from artifacts!"
      python $(Pipeline.Workspace)/athena_pyscript/create_view.py
      echo "Script complete!"
