
# Deployment stage runs after Terraform Stages.
steps:
  - script: |
      echo "Deployment Step after terrafrom!"
  
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.11.1'
      addToPath: true
      architecture: 'x64'

# create virtual environment, install pre reqs,package
  - script: |
      echo "Creating new virtualenv"
      python3 -m venv --clear .env
      source .env/bin/activate 
      python3 -m pip install artifacts-keyring; python3 -m pip install boto3
    displayName: 'Install Boto3'

  - task: AWSCLI@1
    inputs:
      awsCredentials: "sdge-cs-cccanalytics-dev"
      regionName: "us-west-2"  # Change to your desired region

  - script: |
      # Configure AWS CLI
      aws_access_key_id=$(aws configure get aws_access_key_id)
      aws_secret_access_key=$(aws configure get aws_secret_access_key)

      aws configure set aws_access_key_id $aws_access_key_id
      aws configure set aws_secret_access_key $aws_secret_access_key
      aws configure set default.region us-west-2  # Change to your desired region

      # Your AWS CLI commands here
      aws s3 ls
    displayName: 'Run AWS CLI commands'
