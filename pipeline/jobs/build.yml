
# Lambda CI Build Jobs
jobs:
  - template: Pipeline-Templates/Standalone/Jobs/Linting/flake8.yml@DevSecOpsYAML
    parameters: 
      lintingConfig: "warn"

  - job:
    displayName: "Zip the Lambda Code and publish it"

    steps:
      - task: ArchiveFiles
        inputs:
          rootFolderOrFile: './src/lambda/'
          includeRootFolder: false
          archiveType: 'zip'
          archiveFile: './src/lambda/helloworld_serverless.zip'
          replaceExistingArchive: true

      - publish: './src/lambda/helloworld_serverless.zip'
        artifact: 'lambda_zip_package'

