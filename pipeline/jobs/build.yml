jobs:
  - job:
    displayName: 'Publish Artifacts for Quicksight and Athena Views'
    steps:
    - script: |
        ####################################################
        ## Export AWS credentials from pipeline variables ##
        ####################################################

        export AWS_ACCESS_KEY_ID=$(aws-access-key-id)
        export AWS_SECRET_ACCESS_KEY=$(aws-secret-access-key-id)

        #############################
        ###   Set the AWS region  ###
        #############################

        export AWS_DEFAULT_REGION="us-west-2"
        OUTPUT_PROFILE="AWSCLI-AssumeRole" 

        #################################################
        ## Assume the role and capture the credentials ##
        #################################################

        echo "Assuming role..."
        echo "$(awsAssumeRole)"

        # ASSUME_ROLE_OUTPUT=$(aws sts assume-role --role-arn "$(awsAssumeRole)" --role-session-name "$OUTPUT_PROFILE" --output json)
        ASSUME_ROLE_OUTPUT=$(aws sts assume-role --role-arn "arn:aws:iam::442426866507:role/fondo/sdge-dcctr-dev-iam-role-ado" --role-session-name "$OUTPUT_PROFILE" --output json)
        
        #####################################################
        ## Check if the assume-role command was successful ##
        #####################################################

        if [ $? -eq 0 ]; then
          #########################
          ## Extract credentials ##
          #########################

          ACCESS_KEY=$(echo $ASSUME_ROLE_OUTPUT | jq -r '.Credentials.AccessKeyId')
          SECRET_KEY=$(echo $ASSUME_ROLE_OUTPUT | jq -r '.Credentials.SecretAccessKey')
          SESSION_TOKEN=$(echo $ASSUME_ROLE_OUTPUT | jq -r '.Credentials.SessionToken')

          ############################################################################
          ### Export the new session credentials for subsequent AWS CLI commands #####
          ############################################################################

          export AWS_ACCESS_KEY_ID=$ACCESS_KEY
          export AWS_SECRET_ACCESS_KEY=$SECRET_KEY
          export AWS_SESSION_TOKEN=$SESSION_TOKEN
          ASSUMED_ROLE_ARN=$(echo $ASSUME_ROLE_OUTPUT | jq -r '.AssumedRoleUser.Arn')

          echo "Assumed role ARN: $ASSUMED_ROLE_ARN"
          echo "Creating the quicksight file!"

          ########################################################################################################################
          ########################################## Start Export Job for IVR Dashboard ##########################################
          ########################################################################################################################

          aws quicksight start-asset-bundle-export-job --aws-account-id 442426866507 --asset-bundle-export-job-id 'sdge-export-job-IVR' --resource-arns "arn:aws:quicksight:us-west-2:442426866507:dashboard/40ebf7be-50e2-49ed-8136-78aa0117aa65" --include-all-dependencies --export-format 'QUICKSIGHT_JSON' 
          
          ###################################
          ## Extract the dataset json file ##
          ###################################

          aws quicksight describe-data-set --aws-account-id 442426866507 --data-set-id "ce88acbd-2b70-42a4-af08-4d5ebd0b6181" > current-dataset_ivr_data.json

          echo "Present Working directory :  $pwd"
          
          # Code to remove any special chars from the start of json
          # cat current-dataset_ivr_data.json | tr -cd '\11\12\15\40-\176' > current-dataset_ivr_data.json

          ############################################################################
          ###             Extract the dataset part from the entire json          #####
          ############################################################################

          jq '.DataSet' current-dataset_ivr_data.json > dataset_ivr_data.json

          ############################################################################
          ###        Delete the unnecessary parts from the entire json           #####
          ############################################################################

          jq 'del(.Arn, .CreatedTime, .LastUpdatedTime, .OutputColumns, .ConsumedSpiceCapacityInBytes)' dataset_ivr_data.json > updated-dataset_ivr_data.json
          
          echo "After formatting the dataset IVR, the contents of dir are :"

          echo "****************************************"
          ls -sd --block-size=1 --format=single-column *
          echo "****************************************"
          

          ############################################################################################################################
          ########################################## Start the Export Job for FCR Dashboard ##########################################
          ############################################################################################################################
          
          aws quicksight start-asset-bundle-export-job --aws-account-id 442426866507 --asset-bundle-export-job-id 'sdge-export-job-FCR' --resource-arns "arn:aws:quicksight:us-west-2:442426866507:dashboard/24561611-3194-46d5-a19d-42d6350d9c30" --include-all-dependencies --export-format 'QUICKSIGHT_JSON'
          
          ###################################
          ## Extract the dataset json file ##
          ###################################

          aws quicksight describe-data-set --aws-account-id 442426866507 --data-set-id "3aae9ae4-d55d-4e35-9345-4b657a077079" > current-dataset_fcr_data.json
          
          echo "Present Working directory :  $pwd"

          # Code to remove any special chars from the start of json
          # cat current-dataset_fcr_data.json | tr -cd '\11\12\15\40-\176' > current-dataset_fcr_data.json
          
          ############################################################################
          ###             Extract the dataset part from the entire json          #####
          ############################################################################

          jq '.DataSet' current-dataset_fcr_data.json > dataset_fcr_data.json

          ############################################################################
          ###        Delete the unnecessary parts from the entire json           #####
          ############################################################################

          jq 'del(.Arn, .CreatedTime, .LastUpdatedTime, .OutputColumns, .ConsumedSpiceCapacityInBytes)' dataset_fcr_data.json > updated-dataset_fcr_data.json
          
          echo "After formatting the dataset FCR, the contents of dir are :"
          echo "****************************************"
          ls -sd --block-size=1 --format=single-column *
          echo "****************************************"
          
          awsAccountId="442426866507"
          jobId="sdge-export-job-IVR"
          
          ############################################################################################################################
          ########################################## Download the bundle for IVR Dashboard  ##########################################
          ############################################################################################################################

          while true; do

            #########################
            ## Get the job details ##
            #########################

            response=$(aws quicksight describe-asset-bundle-export-job --aws-account-id $awsAccountId --asset-bundle-export-job-id $jobId)
            
            ##################################################
            ##     Check if the command was successful      ##
            ##################################################

            if [ $? -eq 0 ]; then
                jobStatus=$(echo $response | grep -o '"JobStatus": "[^"]*' | grep -o '[^"]*$')
                if [ "$jobStatus" == "SUCCESSFUL" ]; then
                    downloadUrl=$(echo $response | grep -o '"DownloadUrl": "[^"]*' | grep -o '[^"]*$')

                    ##################################################
                    ###         Download the qs json file          ###
                    ##################################################

                    curl -o "./assetbundle-sdge-export-job-IVR.qs" $downloadUrl
                    
                    echo "File downloaded successfully for IVR"
                    break
                else
                    echo "Job status is not successful: $jobStatus"
                    sleep 10
                fi
            else
                echo "Failed to get the job details"
                exit 1
            fi
          done

          
          awsAccountId="442426866507"
          jobId="sdge-export-job-FCR"
          
          ############################################################################################################################
          ##########################################  Download the bundle for FCR Dashboard ##########################################
          ############################################################################################################################

          while true; do

            #########################
            ## Get the job details ##
            #########################

            response=$(aws quicksight describe-asset-bundle-export-job --aws-account-id $awsAccountId --asset-bundle-export-job-id $jobId)
            
            ##################################################
            ##     Check if the command was successful      ##
            ##################################################

            if [ $? -eq 0 ]; then
                jobStatus=$(echo $response | grep -o '"JobStatus": "[^"]*' | grep -o '[^"]*$')
                if [ "$jobStatus" == "SUCCESSFUL" ]; then
                    downloadUrl=$(echo $response | grep -o '"DownloadUrl": "[^"]*' | grep -o '[^"]*$')

                    ##################################################
                    ###         Download the qs json file          ###
                    ##################################################

                    curl -o "./assetbundle-sdge-export-job-FCR.qs" $downloadUrl
                    echo "File downloaded successfully for FCR"

                    echo "Contents of the directory are :"
                    ls -sd --block-size=1 --format=single-column *
                    echo "***************************************"

                    break
                else
                    echo "Job status is not successful: $jobStatus"
                    sleep 10
                fi
            else
                echo "Failed to get the job details"
                exit 1
            fi
          done
        else
            echo "Failed to assume role."
            exit 1
        fi
      displayName: 'Build Code Artifacts For QS Deployment'

    - publish: src/pyscripts/ivr_call_transactions.py
      artifact: ivr_call_transactions
      displayName: 'Publish the PyScript to create athena ivr_call_transactions view as an artifact'

    - publish: src/pyscripts/ivr_call_events.py
      artifact: ivr_call_events
      displayName: 'Publish the PyScript to create athena ivr_call_events view as an artifact'
    
    - publish: src/pyscripts/fcr_data_view.py
      artifact: fcr_data_view
      displayName: 'Publish the PyScript to create athena fcr_data_view view as an artifact'
    
    - publish: src/pyscripts/fcr_boxplot_view.py
      artifact: fcr_boxplot_view
      displayName: 'Publish the PyScript to create athena fcr_data_view view as an artifact'

    - publish: assetbundle-sdge-export-job-IVR.qs
      artifact: QS_Bundle_IVR
      displayName: 'Publish the IVR Quicksight artifact to the pipeline'

    - publish: assetbundle-sdge-export-job-FCR.qs
      artifact: QS_Bundle_FCR
      displayName: 'Publish the FCR Quicksight artifact to the pipeline'

    - publish: updated-dataset_fcr_data.json
      artifact: QS_Bundle_FCR_Dataset
      displayName: 'Publish the FCR QS Dataset artifact to the pipeline'

    - publish: updated-dataset_ivr_data.json
      artifact: QS_Bundle_IVR_Dataset
      displayName: 'Publish the FCR QS Dataset artifact to the pipeline'

  - job:
    displayName: 'Create and publish Lambda artifacts for containment rate alerts'
    steps:
    - script: |
        set -e
        set -x

        # Zip containment_alerts.py file for Lambda
        LAMBDA_DIR='src/lambda/alerts_lambda'
        cd $LAMBDA_DIR
        zip -r containment_alerts.zip containment_alerts.py
        echo "Listing contents of the directory '$(pwd)'"
        ls
      displayName: 'Build Code Artifact for Containment Alerts Lambda'

    - publish: src/lambda/alerts_lambda/containment_alerts.zip
      artifact: containment_alerts
      displayName: 'Publish Containment AlertsLambda zip as an Azure Pipeline Artifact named containment_alerts'
